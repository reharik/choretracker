name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        type: boolean
        default: true
      deploy_frontend:
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    # Pinned to the last infra revision that matches this app's vendored infra/ subtree
    # (aebc3fe "fixing deploy detect changes"). `@main` moved ahead to a workflow that
    # requires generate-prod-workers-compose.sh, which this subtree doesn't carry.
    uses: reharik/cannibal-infra/.github/workflows/deploy-ec2.yml@aebc3fe10bc791f375fe15164a41c198569579a1
    with:
      deploy_backend: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend || true }}
      deploy_frontend: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_frontend || true }}
    secrets: inherit