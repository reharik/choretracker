name: chore-tracker-dev

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chore_tracker}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chore_tracker}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: dev
    image: chore-tracker-api:dev
    container_name: chore_tracker_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      # Docker-specific values (must be set here, not in .env)
      NODE_ENV: development
      POSTGRES_HOST: db
      # Dev tooling configuration (dev-specific, not application config)
      CHOKIDAR_USEPOLLING: '1'
      WATCHPACK_POLLING: 'true'
      NODEMON_IGNORE: 'dist,node_modules,coverage'
      NODEMON_WATCH: 'api/src'
      NODEMON_EXEC: 'tsx api/src/index.ts'
      # All other values (PORT, POSTGRES_*, CORS_ORIGIN, JWT_SECRET, etc.)
      # should be defined in ./api/.env file
    ports:
      - '3000:3000'
    volumes:
      # Mount source code and config files for hot reload
      - ./api:/app/api
      - ./contracts:/app/contracts
      - ./node_modules:/app/node_modules
      # Exclude individual workspace node_modules to use container's versions
      - /app/api/node_modules
      - /app/contracts/node_modules
    command: npm run dev --workspace=@app/api

volumes:
  pgdata:
